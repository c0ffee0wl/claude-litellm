# LiteLLM Proxy config — see https://docs.litellm.ai/docs/proxy/config_settings
# Public Model Names match upstream ids (no `claude-*` alias layer).
# Secrets resolve from ~/.config/litellm/env (mode 600, systemd EnvironmentFile).
# See CLAUDE.md > "Model naming" for the discovery / feature-gate trade-offs.

model_list:
  # The `azure/` prefix on model_name is a LABEL (which cloud this lands on),
  # NOT the LiteLLM provider route. The route is `openai/` deliberately: LiteLLM's
  # /v1/messages handler only takes the purpose-built Responses adapter when
  # custom_llm_provider == "openai" (_RESPONSES_API_PROVIDERS is frozenset({"openai"})).
  # Under `azure/`, Claude Code's traffic falls back to chat completions and only
  # reaches /responses when reasoning_effort AND tools are both present.
  # See CLAUDE.md > "Model naming" > "Why the openai/ route".
  #
  # api_base is the Azure v1 surface (…/openai/v1), canonicalized by
  # normalize_azure_v1_endpoint in setup.sh. No api_version: the v1 GA API does
  # not take one, and a query string would corrupt the `{api_base}/responses` URL.
  #
  # model_info.base_model exists ONLY to fix cost tracking. The `openai/` route
  # above also drives the price lookup — _select_model_name_for_cost_calc resolves
  # the map key `gpt-5.6-<tier>`, i.e. OPENAI list prices, for traffic that Azure
  # actually invoices. base_model overrides that key (it wins over every other
  # signal, reaching the cost calc via metadata.model_info.base_model) without
  # touching the route: the other base_model consumers in litellm/utils.py are
  # gated on custom_llm_provider == "azure", which never fires here. The two map
  # entries are otherwise identical — same supports_*, max_*, mode,
  # supported_endpoints; only litellm_provider differs.
  #
  # `azure/eu/` = Data Zone Standard in the EU zone. Sweden Central sits inside the
  # Azure EU Data Boundary, so a DataZoneStandard deployment there bills the `DZ`
  # meters. Verified 2026-08-04 against the Azure retail feed — $/1M tokens,
  # short-context standard (in / cached-in / out):
  #     terra  2.75 / 0.275 / 16.50      luna  1.10 / 0.11 / 6.60
  #     sol    5.50 / 0.55  / 33.00
  # which LiteLLM's azure/eu/gpt-5.6-* entries match exactly, long-context tiers
  # included. Re-check with:
  #   productName eq 'Azure OpenAI GPT5' and armRegionName eq 'swedencentral'
  #   → https://prices.azure.com/api/retail/prices?api-version=2023-01-01-preview
  #
  # Two ways this can go stale:
  #   - Deployment type/zone changes → GlobalStandard is `azure/gpt-5.6-*`, the US
  #     zone is `azure/us/gpt-5.6-*`. Those must be edited here.
  #   - Azure follows OpenAI's 2026-07-30 cut (terra -20%, luna -80%, sol flat),
  #     which it had NOT as of this writing — hence luna costing 5.5x its OpenAI
  #     list price. NO edit needed when it lands: only a map key is pinned here,
  #     never a rate, so a refreshed price map propagates on the next upgrade.
  - model_name: azure/gpt-5.6-terra
    litellm_params:
      model: openai/gpt-5.6-terra
      api_base: os.environ/AZURE_RESOURCE_ENDPOINT
      api_key: os.environ/AZURE_OPENAI_API_KEY
    model_info:
      base_model: azure/eu/gpt-5.6-terra

  - model_name: azure/gpt-5.6-luna
    litellm_params:
      model: openai/gpt-5.6-luna
      api_base: os.environ/AZURE_RESOURCE_ENDPOINT
      api_key: os.environ/AZURE_OPENAI_API_KEY
    model_info:
      base_model: azure/eu/gpt-5.6-luna

  # Flagship tier — wired to Claude Code's `fable` alias via
  # ANTHROPIC_DEFAULT_FABLE_MODEL (setup.sh Phase 5a), so `/model fable`,
  # `/model azure/gpt-5.6-sol` and subagent frontmatter `model: fable` all land
  # here. Never auto-selected: no background path uses the fable alias, so it
  # costs nothing unless asked for. Requires a `gpt-5.6-sol` deployment;
  # without one it 404s at call time (LiteLLM does not validate at boot) and
  # nothing else is affected.
  - model_name: azure/gpt-5.6-sol
    litellm_params:
      model: openai/gpt-5.6-sol
      api_base: os.environ/AZURE_RESOURCE_ENDPOINT
      api_key: os.environ/AZURE_OPENAI_API_KEY
    model_info:
      base_model: azure/eu/gpt-5.6-sol

litellm_settings:
  drop_params: true
  request_timeout: 600
  num_retries: 2
  json_logs: true
  # Ask Azure for reasoning summaries (summary: "detailed") on the Responses
  # API. Without this (LiteLLM default: off) the Anthropic→Responses adapter
  # emits ZERO thinking blocks: reasoning tokens still bill, Claude Code
  # displays nothing. Summaries are not guaranteed on every request (expected —
  # Azure reasoning-models doc). If Azure 400s naming `summary` (subscription
  # lacks summary access), set this to false in the repo's
  # linux/configs/litellm-config.yaml — setup.sh regenerates the deployed copy
  # from that template on every run, so hand-edits here don't survive.
  # Mechanism + source refs: CLAUDE.md > Troubleshooting.
  reasoning_auto_summary: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL  # local Postgres provisioned by setup.sh Phase 6; enables /ui model management + spend/key tracking

