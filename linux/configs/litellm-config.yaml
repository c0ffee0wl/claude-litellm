# LiteLLM Proxy config — see https://docs.litellm.ai/docs/proxy/config_settings
# Public Model Names match upstream ids (no `claude-*` alias layer).
# Secrets resolve from ~/.config/litellm/env (mode 600, systemd EnvironmentFile).
# See CLAUDE.md > "Model naming" for the discovery / feature-gate trade-offs.

model_list:
  # The `azure/` prefix on model_name is a LABEL (which cloud this lands on),
  # NOT the LiteLLM provider route. The route is `openai/` deliberately: LiteLLM's
  # /v1/messages handler only takes the purpose-built Responses adapter when
  # custom_llm_provider == "openai" (_RESPONSES_API_PROVIDERS is frozenset({"openai"})).
  # Under `azure/`, Claude Code's traffic falls back to chat completions and only
  # reaches /responses when reasoning_effort AND tools are both present.
  # See CLAUDE.md > "Model naming" > "Why the openai/ route".
  #
  # api_base is the Azure v1 surface (…/openai/v1), canonicalized by
  # normalize_azure_v1_endpoint in setup.sh. No api_version: the v1 GA API does
  # not take one, and a query string would corrupt the `{api_base}/responses` URL.
  #
  # model_info carries EXPLICIT per-token rates ONLY to fix cost tracking. The
  # `openai/` route above also drives the price lookup, so without them every
  # request bills the OPENAI map key `gpt-5.6-<tier>` — i.e. OpenAI list prices
  # for traffic Azure invoices. Understated terra 1.38x, luna 5.50x, sol 1.10x.
  #
  # `model_info.base_model: azure/eu/gpt-5.6-<tier>` is the obvious fix and does
  # NOT work here — verified against litellm 1.93.0, do not re-try it.
  # _select_model_name_for_cost_calc does return the azure/eu key, but the
  # downstream lookup passes the route's provider alongside it, and
  #     get_model_info("azure/eu/gpt-5.6-luna", custom_llm_provider="openai")
  # raises "This model isn't mapped yet" (the map entry's litellm_provider is
  # `azure`). The cost calculator swallows that and silently falls back to the
  # OpenAI entry. base_model can only name a key whose provider matches the
  # route's, so it is unusable on the deliberate `openai/` route. Explicit rates
  # are provider-agnostic — they bypass the map lookup entirely.
  #
  # Rates are Azure Data Zone Standard, EU zone: Sweden Central sits inside the
  # Azure EU Data Boundary, so a DataZoneStandard deployment there bills the `DZ`
  # meters. Verified 2026-08-04 against the Azure retail feed — $/1M tokens,
  # short context (in / cached-in / out), long context (>272k) on the second row:
  #     terra  2.75 / 0.275 / 16.50   |  5.50 / 0.55 / 24.75
  #     luna   1.10 / 0.11  /  6.60   |  2.20 / 0.22 /  9.90
  #     sol    5.50 / 0.55  / 33.00   |  11.0 / 1.10 / 49.50
  # Refresh these with the `update-azure-openai-prices` skill
  # (.claude/skills/), which reads the live feed and rewrites both the rate
  # blocks and the table above. Do not hand-query the feed — the skill's script
  # owns the meter-name grammar, and a second recipe here would drift from it.
  #
  # Worth re-running when the deployment type or zone changes (the script takes
  # --scope Gl / --region), or when Azure follows OpenAI's 2026-07-30 cut
  # (terra -20%, luna -80%, sol flat) — which it had NOT as of this writing,
  # hence luna costing 5.5x its OpenAI list price. Meters dated later than
  # 2026-07-01 mean Azure repriced.
  - model_name: azure/gpt-5.6-terra
    litellm_params:
      model: openai/gpt-5.6-terra
      api_base: os.environ/AZURE_RESOURCE_ENDPOINT
      api_key: os.environ/AZURE_OPENAI_API_KEY
    model_info:
      input_cost_per_token: 2.75e-06
      output_cost_per_token: 1.65e-05
      cache_read_input_token_cost: 2.75e-07
      input_cost_per_token_above_272k_tokens: 5.5e-06
      output_cost_per_token_above_272k_tokens: 2.475e-05
      cache_read_input_token_cost_above_272k_tokens: 5.5e-07

  - model_name: azure/gpt-5.6-luna
    litellm_params:
      model: openai/gpt-5.6-luna
      api_base: os.environ/AZURE_RESOURCE_ENDPOINT
      api_key: os.environ/AZURE_OPENAI_API_KEY
    model_info:
      input_cost_per_token: 1.1e-06
      output_cost_per_token: 6.6e-06
      cache_read_input_token_cost: 1.1e-07
      input_cost_per_token_above_272k_tokens: 2.2e-06
      output_cost_per_token_above_272k_tokens: 9.9e-06
      cache_read_input_token_cost_above_272k_tokens: 2.2e-07

  # Flagship tier — wired to Claude Code's `fable` alias via
  # ANTHROPIC_DEFAULT_FABLE_MODEL (setup.sh Phase 5a), so `/model fable`,
  # `/model azure/gpt-5.6-sol` and subagent frontmatter `model: fable` all land
  # here. Never auto-selected: no background path uses the fable alias, so it
  # costs nothing unless asked for. Requires a `gpt-5.6-sol` deployment;
  # without one it 404s at call time (LiteLLM does not validate at boot) and
  # nothing else is affected.
  - model_name: azure/gpt-5.6-sol
    litellm_params:
      model: openai/gpt-5.6-sol
      api_base: os.environ/AZURE_RESOURCE_ENDPOINT
      api_key: os.environ/AZURE_OPENAI_API_KEY
    model_info:
      input_cost_per_token: 5.5e-06
      output_cost_per_token: 3.3e-05
      cache_read_input_token_cost: 5.5e-07
      input_cost_per_token_above_272k_tokens: 1.1e-05
      output_cost_per_token_above_272k_tokens: 4.95e-05
      cache_read_input_token_cost_above_272k_tokens: 1.1e-06

litellm_settings:
  drop_params: true
  request_timeout: 600
  num_retries: 2
  json_logs: true
  # Ask Azure for reasoning summaries (summary: "detailed") on the Responses
  # API. Without this (LiteLLM default: off) the Anthropic→Responses adapter
  # emits ZERO thinking blocks: reasoning tokens still bill, Claude Code
  # displays nothing. Summaries are not guaranteed on every request (expected —
  # Azure reasoning-models doc). If Azure 400s naming `summary` (subscription
  # lacks summary access), set this to false in the repo's
  # linux/configs/litellm-config.yaml — setup.sh regenerates the deployed copy
  # from that template on every run, so hand-edits here don't survive.
  # Mechanism + source refs: CLAUDE.md > Troubleshooting.
  reasoning_auto_summary: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL  # local Postgres provisioned by setup.sh Phase 6; enables /ui model management + spend/key tracking

