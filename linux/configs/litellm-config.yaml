# LiteLLM Proxy config — see https://docs.litellm.ai/docs/proxy/config_settings
# Public Model Names match upstream ids (no `claude-*` alias layer).
# Secrets resolve from ~/.config/litellm/env (mode 600, systemd EnvironmentFile).
# See CLAUDE.md > "Model naming" for the discovery / feature-gate trade-offs.

model_list:
  # The `azure/` prefix on model_name is a LABEL (which cloud this lands on),
  # NOT the LiteLLM provider route. The route is `openai/` deliberately: LiteLLM's
  # /v1/messages handler only takes the purpose-built Responses adapter when
  # custom_llm_provider == "openai" (_RESPONSES_API_PROVIDERS is frozenset({"openai"})).
  # Under `azure/`, Claude Code's traffic falls back to chat completions and only
  # reaches /responses when reasoning_effort AND tools are both present.
  # See CLAUDE.md > "Model naming" > "Why the openai/ route".
  #
  # api_base is the Azure v1 surface (…/openai/v1), canonicalized by
  # normalize_azure_v1_endpoint in setup.sh. No api_version: the v1 GA API does
  # not take one, and a query string would corrupt the `{api_base}/responses` URL.
  #
  # model_info carries EXPLICIT per-token rates ONLY to fix cost tracking. The
  # `openai/` route above also drives the price lookup, so without them every
  # request bills the OPENAI map key `gpt-<family>-<tier>` — i.e. OpenAI list
  # prices for traffic Azure invoices (Azure's DZ meters run ~1.2x OpenAI list).
  #
  # `model_info.base_model: azure/eu/gpt-<family>-<tier>` is the obvious fix and
  # does NOT work here — verified against litellm 1.93.0, do not re-try it.
  # _select_model_name_for_cost_calc does return the azure/eu key, but the
  # downstream lookup passes the route's provider alongside it, and
  #     get_model_info("azure/eu/gpt-5.6-luna", custom_llm_provider="openai")
  # raises "This model isn't mapped yet" (the map entry's litellm_provider is
  # `azure`). The cost calculator swallows that and silently falls back to the
  # OpenAI entry. base_model can only name a key whose provider matches the
  # route's, so it is unusable on the deliberate `openai/` route. Explicit rates
  # are provider-agnostic — they bypass the map lookup entirely.
  #
  # The cache-write pair (cache_creation_input_token_cost[_above_272k_tokens])
  # comes from Azure's `Cd Wr` meters — 1.25x input on both GPT-5.6 and GPT-6.
  # The Responses API rarely reports cache-creation tokens, but the keys are
  # stated anyway: when a deployment omits them,
  # Router._inherit_builtin_cache_pricing copies OPENAI's cache-write rate onto
  # Azure traffic. The skill below manages all eight keys.
  #
  # Rates are Azure Data Zone Standard, EU zone: Sweden Central sits inside the
  # Azure EU Data Boundary, so a DataZoneStandard deployment there bills the `DZ`
  # meters. Verified 2026-11-13 against the Azure retail feed — $/1M tokens,
  # short context (in / cached-in / cache-wr / out), long context (>272k) second:
  #     gpt-6.1-terra  1.20 / 0.06  / 1.50  /  6.00  |  2.40 / 0.12  / 3.00 /  9.00
  #     gpt-6-luna     0.12 / 0.012 / 0.15  /  0.60  |  0.24 / 0.024 / 0.30 /  0.90
  #     gpt-6.1-sol    2.40 / 0.12  / 3.00  / 12.00  |  4.80 / 0.24  / 6.00 / 18.00
  #     gpt-6-astra    12.0 / 1.20  / 15.0  / 60.00  |  24.0 / 2.40  / 30.0 / 90.00
  #     gpt-5.6-terra  2.20 / 0.22  / 2.75  / 13.20  |  4.40 / 0.44  / 5.50 / 19.80
  #     gpt-5.6-luna   0.22 / 0.022 / 0.275 /  1.32  |  0.44 / 0.044 / 0.55 /  1.98
  #     gpt-5.6-sol    4.40 / 0.44  / 5.50  / 22.00  |  8.80 / 0.88  / 11.0 / 33.00
  # Refresh these with the `update-azure-openai-prices` skill
  # (.claude/skills/), which reads the live feed and prints the rate blocks and
  # this table's rows. Do not hand-query the feed — the skill's script owns the
  # meter-name grammar (which differs between GPT-5.6 and GPT-6), and a second
  # recipe here would drift from it. Re-run it when the deployment type or zone
  # changes (the script takes --scope Gl / --region), and after any model_list
  # change. Meter dates newer than 2026-10-01 mean Azure repriced.
  #
  # TIERS AND FALLBACKS. setup.sh Phase 5a points Claude Code's four aliases at
  # the GPT-6 generation: haiku -> gpt-6-luna (also every background call:
  # titles, compaction summaries, the Explore subagent), sonnet -> gpt-6.1-terra,
  # opus -> gpt-6.1-sol, fable -> gpt-6-astra (premium, never auto-selected).
  # The GPT-5.6 entries stay as FALLBACK TARGETS only (router_settings.fallbacks
  # below): an Azure deployment that is missing, renamed, retired or failing
  # degrades a request onto the previous generation instead of failing it — the
  # haiku slot most of all, since a dead background model breaks compaction.
  # A fallback only helps while its target deployment exists in Azure; when the
  # 5.6 deployments are deleted, its entries can go too (drop the fallbacks
  # first). Every Public Model Name here is ALSO the Azure deployment name the
  # `openai/` route sends as `model` — keep the two identical.
  #
  # Per-deployment capability fields (max_input_tokens, supports_*_reasoning_
  # effort) pin what LiteLLM would otherwise only learn from the model map it
  # fetches at startup — the wheel's bundled fallback map may predate a model
  # (1.108.0's lacks gpt-6.1-terra), and a failed fetch would then silently
  # downgrade effort: max to `high`. gpt-6-astra pins
  # supports_max_reasoning_effort: false because Azure's map entry says so while
  # the OPENAI entry (which the `openai/` route reads) says true — sending
  # `max` would 400.
  - model_name: azure/gpt-6.1-terra
    litellm_params:
      model: openai/gpt-6.1-terra
      api_base: os.environ/AZURE_RESOURCE_ENDPOINT
      api_key: os.environ/AZURE_OPENAI_API_KEY
    model_info:
      max_input_tokens: 922000
      max_output_tokens: 128000
      supports_reasoning: true
      supports_xhigh_reasoning_effort: true
      supports_max_reasoning_effort: true
      input_cost_per_token: 1.2e-06
      output_cost_per_token: 6e-06
      cache_read_input_token_cost: 6e-08
      cache_creation_input_token_cost: 1.5e-06
      input_cost_per_token_above_272k_tokens: 2.4e-06
      output_cost_per_token_above_272k_tokens: 9e-06
      cache_read_input_token_cost_above_272k_tokens: 1.2e-07
      cache_creation_input_token_cost_above_272k_tokens: 3e-06

  - model_name: azure/gpt-6-luna
    litellm_params:
      model: openai/gpt-6-luna
      api_base: os.environ/AZURE_RESOURCE_ENDPOINT
      api_key: os.environ/AZURE_OPENAI_API_KEY
    model_info:
      max_input_tokens: 922000
      max_output_tokens: 128000
      supports_reasoning: true
      supports_xhigh_reasoning_effort: true
      supports_max_reasoning_effort: true
      input_cost_per_token: 1.2e-07
      output_cost_per_token: 6e-07
      cache_read_input_token_cost: 1.2e-08
      cache_creation_input_token_cost: 1.5e-07
      input_cost_per_token_above_272k_tokens: 2.4e-07
      output_cost_per_token_above_272k_tokens: 9e-07
      cache_read_input_token_cost_above_272k_tokens: 2.4e-08
      cache_creation_input_token_cost_above_272k_tokens: 3e-07

  - model_name: azure/gpt-6.1-sol
    litellm_params:
      model: openai/gpt-6.1-sol
      api_base: os.environ/AZURE_RESOURCE_ENDPOINT
      api_key: os.environ/AZURE_OPENAI_API_KEY
    model_info:
      max_input_tokens: 922000
      max_output_tokens: 128000
      supports_reasoning: true
      supports_xhigh_reasoning_effort: true
      supports_max_reasoning_effort: true
      input_cost_per_token: 2.4e-06
      output_cost_per_token: 1.2e-05
      cache_read_input_token_cost: 1.2e-07
      cache_creation_input_token_cost: 3e-06
      input_cost_per_token_above_272k_tokens: 4.8e-06
      output_cost_per_token_above_272k_tokens: 1.8e-05
      cache_read_input_token_cost_above_272k_tokens: 2.4e-07
      cache_creation_input_token_cost_above_272k_tokens: 6e-06

  # Premium tier — Claude Code's `fable` alias (ANTHROPIC_DEFAULT_FABLE_MODEL,
  # setup.sh Phase 5a), so `/model fable` and subagent frontmatter
  # `model: fable` land here. Never auto-selected: no background path uses the
  # fable alias, so its 5x price only applies when asked for.
  - model_name: azure/gpt-6-astra
    litellm_params:
      model: openai/gpt-6-astra
      api_base: os.environ/AZURE_RESOURCE_ENDPOINT
      api_key: os.environ/AZURE_OPENAI_API_KEY
    model_info:
      max_input_tokens: 922000
      max_output_tokens: 128000
      supports_reasoning: true
      supports_xhigh_reasoning_effort: true
      supports_max_reasoning_effort: false
      input_cost_per_token: 1.2e-05
      output_cost_per_token: 6e-05
      cache_read_input_token_cost: 1.2e-06
      cache_creation_input_token_cost: 1.5e-05
      input_cost_per_token_above_272k_tokens: 2.4e-05
      output_cost_per_token_above_272k_tokens: 9e-05
      cache_read_input_token_cost_above_272k_tokens: 2.4e-06
      cache_creation_input_token_cost_above_272k_tokens: 3e-05

  # --- Previous generation: fallback targets (see TIERS AND FALLBACKS) -------
  - model_name: azure/gpt-5.6-terra
    litellm_params:
      model: openai/gpt-5.6-terra
      api_base: os.environ/AZURE_RESOURCE_ENDPOINT
      api_key: os.environ/AZURE_OPENAI_API_KEY
    model_info:
      input_cost_per_token: 2.2e-06
      output_cost_per_token: 1.32e-05
      cache_read_input_token_cost: 2.2e-07
      cache_creation_input_token_cost: 2.75e-06
      input_cost_per_token_above_272k_tokens: 4.4e-06
      output_cost_per_token_above_272k_tokens: 1.98e-05
      cache_read_input_token_cost_above_272k_tokens: 4.4e-07
      cache_creation_input_token_cost_above_272k_tokens: 5.5e-06

  - model_name: azure/gpt-5.6-luna
    litellm_params:
      model: openai/gpt-5.6-luna
      api_base: os.environ/AZURE_RESOURCE_ENDPOINT
      api_key: os.environ/AZURE_OPENAI_API_KEY
    model_info:
      input_cost_per_token: 2.2e-07
      output_cost_per_token: 1.32e-06
      cache_read_input_token_cost: 2.2e-08
      cache_creation_input_token_cost: 2.75e-07
      input_cost_per_token_above_272k_tokens: 4.4e-07
      output_cost_per_token_above_272k_tokens: 1.98e-06
      cache_read_input_token_cost_above_272k_tokens: 4.4e-08
      cache_creation_input_token_cost_above_272k_tokens: 5.5e-07

  - model_name: azure/gpt-5.6-sol
    litellm_params:
      model: openai/gpt-5.6-sol
      api_base: os.environ/AZURE_RESOURCE_ENDPOINT
      api_key: os.environ/AZURE_OPENAI_API_KEY
    model_info:
      input_cost_per_token: 4.4e-06
      output_cost_per_token: 2.2e-05
      cache_read_input_token_cost: 4.4e-07
      cache_creation_input_token_cost: 5.5e-06
      input_cost_per_token_above_272k_tokens: 8.8e-06
      output_cost_per_token_above_272k_tokens: 3.3e-05
      cache_read_input_token_cost_above_272k_tokens: 8.8e-07
      cache_creation_input_token_cost_above_272k_tokens: 1.1e-05

litellm_settings:
  drop_params: true
  request_timeout: 600
  num_retries: 2
  json_logs: true
  # Ask Azure for reasoning summaries (summary: "detailed") on the Responses
  # API. Without this (LiteLLM default: off) the Anthropic→Responses adapter
  # emits ZERO thinking blocks: reasoning tokens still bill, Claude Code
  # displays nothing. Summaries are not guaranteed on every request (expected —
  # Azure reasoning-models doc). If Azure 400s naming `summary` (subscription
  # lacks summary access), set this to false in the repo's
  # linux/configs/litellm-config.yaml — setup.sh regenerates the deployed copy
  # from that template on every run, so hand-edits here don't survive.
  # Mechanism + source refs: CLAUDE.md > Troubleshooting.
  reasoning_auto_summary: true

router_settings:
  # No `timeout:` and no `stream_timeout:` here: on the /v1/messages path
  # Claude Code uses, the upstream timeout resolves (1.108.0,
  # passthrough/timeout_utils.py) per-request -> deployment -> these router
  # keys (stream_timeout first, for streaming) -> litellm_settings
  # .request_timeout above -> 600s. So the one 600 above governs every route,
  # streaming or not — deliberately long, because an `effort: high/xhigh`
  # turn can legitimately sit silent for minutes. It reaches aiohttp as an
  # idle-gap bound. Per-request override: the `x-litellm-timeout` header.
  # CLAUDE.md > "Retries and fallbacks DO apply on /v1/messages".
  # Every model group here has exactly ONE deployment, so a cooldown has nothing
  # to fail over to WITHIN the group — it just converts a single recoverable
  # error into "No deployments available for selected model" for the cooldown
  # window, and that error would also be what the fallback below sees. It fires
  # on any non-retryable status, e.g. the 404 of a deployment that does not
  # exist. Safe to disable precisely BECAUSE no group has a second deployment;
  # revisit if one ever gains one.
  disable_cooldowns: true
  # Cross-GROUP failover: once a GPT-6 group has exhausted its retries, the
  # request is replayed on the next group in its list (see the TIERS AND
  # FALLBACKS note above model_list). Each chain ends on a tier that is billed
  # at its own rates, so a fallback can never be mis-costed. Only the four
  # primary groups fall back; the 5.6 targets fail as they are, so no chain
  # can loop. A degraded request is NOT visible in the statusline (it shows
  # the configured upstream from /model/info) — look for the
  # `x-litellm-attempted-fallbacks` response header, the WARNING-level
  # fallback line in `journalctl --user -u litellm`, or the serving model in
  # /ui's spend logs.
  fallbacks:
    - azure/gpt-6-luna: [azure/gpt-5.6-luna, azure/gpt-6.1-terra]
    - azure/gpt-6.1-terra: [azure/gpt-5.6-terra]
    - azure/gpt-6.1-sol: [azure/gpt-5.6-sol, azure/gpt-6.1-terra]
    - azure/gpt-6-astra: [azure/gpt-6.1-sol]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL  # local Postgres provisioned by setup.sh Phase 6; enables /ui model management + spend/key tracking
  # Bound server-side so a stuck query cannot hold its locks indefinitely — the
  # fix for an orphaned Prisma child holding the advisory lock after a killed
  # schema sync. Two traps live on these two lines:
  #   * UNITS ARE SECONDS. litellm multiplies by 1000 itself, so writing the
  #     millisecond value is a silent no-op guard (60000 => a 16.7-HOUR bound).
  #   * The startup `prisma migrate deploy` runs UNDER these bounds — litellm's
  #     schema declares no `directUrl`, so upstream's "migrations are exempt"
  #     carve-out does not apply here. Hence 600, not the 60s a runtime-only
  #     bound would want: a cancelled migration crash-loops the unit.
  # Derivation, symptoms and when to raise: CLAUDE.md > Troubleshooting.
  database_statement_timeout: 600  # seconds -> statement_timeout=600000ms
  database_lock_timeout: 10        # seconds -> lock_timeout=10000ms
  # Prune LiteLLM_SpendLogs — it grows unbounded on a single box nobody
  # administers, and the statusline only ever reads a trailing 30 days.
  maximum_spend_logs_retention_period: "90d"
  # Batch spend writes at 60s instead of the 10s default — the statusline
  # tolerates a minute of lag and this removes most idle DB traffic.
  proxy_batch_write_at: 60
  # With store_model_in_db the proxy polls the DB for config changes; the 30s
  # default is ~2880 round-trips/day on a single-user box that changes models
  # by hand.
  proxy_config_reload_interval_seconds: 300
  # Off: litellm 1.108.0 GETs `<api_base>/models` with the deployment's
  # key every 300s for every openai/-route deployment, to learn token limits.
  # Here that is 7 authenticated Azure calls per 5 minutes, through the DNS
  # path CLAUDE.md > Troubleshooting documents as fragile, to learn limits the
  # GPT-6 entries above already pin. (proxy_server.py `refresh_model_info`,
  # router.py `arefresh_model_info`.)
  disable_model_info_refresh: true

